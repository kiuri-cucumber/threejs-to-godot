<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>04 · Three.js before migration</title>
<style>

<h1>Reach the green tile</h1><p>Three.js original · Move with WASD / arrow keys. Go around the amber wall. R or Restart resets the game.</p>
